name: zanzibarr

services:
  android:
    build:
      context: .
      dockerfile: Dockerfile.android
    volumes:
      - .:/app:cached
      - ./output:/output
      - app-build:/app/build
      - app-dart-tool:/app/.dart_tool
      - app-android-gradle:/app/android/.gradle
      - gradle-cache:/root/.gradle
      - pub-cache:/root/.pub-cache
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - android-keystore:/root/.android
    environment:
      # TARGET_PLATFORMS=android-arm,android-arm64,android-x64
      - TARGET_PLATFORMS=${TARGET_PLATFORMS:-android-arm64}
    command: >
      sh -c "
        set -e;
        flutter pub get;
        flutter build apk --release --split-per-abi --target-platform $${TARGET_PLATFORMS};
        mkdir -p /output;
        for f in build/app/outputs/flutter-apk/app-*-release.apk; do
          abi=$${f#build/app/outputs/flutter-apk/app-}; abi=$${abi%-release.apk};
          cp \"$$f\" \"/output/zanzibarr-android-$$abi.apk\";
          echo \"-> /output/zanzibarr-android-$$abi.apk\";
        done
      "

  test: &test
    profiles: [test]
    image: zanzibarr-android
    build:
      context: .
      dockerfile: Dockerfile.android
    volumes:
      - .:/app:cached
      - app-dart-tool:/app/.dart_tool
      - rust-target:/app/rust/target
      - pub-cache:/root/.pub-cache
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    command: >
      sh -c "
        set -e;
        cd rust;
        cargo test;
        cargo clippy --all-targets -- -D warnings;
        cargo build;
        cd ..;
        flutter pub get;
        flutter analyze lib test;
        flutter test
      "

  codegen:
    <<: *test
    command: >
      sh -c "
        set -e;
        flutter pub get;
        flutter_rust_bridge_codegen generate
      "

  test-rust:
    <<: *test
    working_dir: /app/rust
    command: >
      sh -c "
        set -e;
        cargo test;
        cargo clippy --all-targets -- -D warnings
      "

  test-flutter:
    <<: *test
    command: >
      sh -c "
        set -e;
        cargo build --manifest-path rust/Cargo.toml;
        flutter pub get;
        flutter analyze lib test;
        flutter test
      "

volumes:
  rust-target:
  app-build:
  app-dart-tool:
  app-android-gradle:
  gradle-cache:
  pub-cache:
  cargo-registry:
  cargo-git:
  android-keystore:
